[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tower-sdk"
version = "0.1.0"
description = "Agent Control Tower SDK: tagged shared-notebook memory for multi-agent teams"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.optional-dependencies]
meko = ["mcp>=1.0"]

[project.scripts]
tower = "tower.cli:main"

[tool.setuptools]
packages = ["tower"]
